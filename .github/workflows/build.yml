
name: Build Agra GUI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./Agra-GUI/gradlew" ]; then
            echo "dir=Agra-GUI" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: gradlew was not found!"
            find . -maxdepth 4 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: chmod +x gradlew

      - name: Build Mod
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Agra-GUI-Fabric
          path: ${{ steps.gradle.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
